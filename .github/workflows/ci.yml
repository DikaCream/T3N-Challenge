name: CI

on:
  push:
    branches: [main]
  pull_request:

# The two Node versions are the documented minimum (22.18, where native type
# stripping becomes the default) and the version the walkthrough was recorded
# on. The macOS runner exists because the tests must not depend on a Linux
# target: a maintainer on a Mac has to be able to run `npm test` and get green.
jobs:
  verify:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.18.0", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/employee-onboarding

      - run: npm ci

      - name: Typecheck, unit tests and contract tests
        run: npm test

      - name: Build the contract to wasm
        run: npm run build:contract

      - name: Build the web console
        run: npm run build
